<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>crossroads - shhh</title>
  <meta name="description" content="hello, we now hangout here" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/css/app.css" />
  <script>
    /* Runs before the body paints. Visitors without a session are sent to the
       landing page immediately, so they never see a half-rendered app before
       being bounced back. Signed-in users get a boot gate until data loads. */
    (function () {
      try {
        if (!localStorage.getItem('cr_token')) { location.replace('/'); return; }
        document.documentElement.classList.add('booting');
      } catch (e) { location.replace('/'); }
    })();
  </script>
  <style>
    html.booting body { overflow: hidden; }
    .boot-gate { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center;
      background: var(--bg-base, #1e1f22); color: var(--text-normal, #dbdee1);
      transition: opacity .24s ease; }
    .boot-gate.done { opacity: 0; pointer-events: none; }
    .boot-gate .bg-inner { display: flex; flex-direction: column; align-items: center; gap: 15px; }
    .boot-gate .bg-spinner { width: 34px; height: 34px; border-radius: 50%;
      border: 3px solid color-mix(in srgb, var(--text-normal, #dbdee1) 18%, transparent);
      border-top-color: var(--brand, #5865f2); animation: bgspin .8s linear infinite; }
    @keyframes bgspin { to { transform: rotate(360deg); } }
    .boot-gate .bg-brand { font-weight: 800; letter-spacing: .02em; font-size: 15px; }
    .boot-gate .bg-sub { font-size: 12.5px; color: var(--text-muted, #949ba4); }
    /* Shown when the free Render instance is waking from sleep. */
    .boot-gate.waking .bg-spinner { animation-duration: 1.4s; opacity: .8; }
    .boot-gate.waking .bg-sub { color: var(--text-normal, #dbdee1); }
  </style>
</head>
<body data-theme="dark" data-bg="graphite">
  <script>
    /* Apply the saved theme/background synchronously, before the first paint,
       so switching themes never flashes back to the default on refresh. */
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('cr_settings') || '{}');
        if (s.theme) document.body.setAttribute('data-theme', s.theme);
        if (s.bg) document.body.setAttribute('data-bg', s.bg);
      } catch (e) { /* ignore */ }
    })();
  </script>
  <div class="app-bg-layer" id="app-bg-layer" aria-hidden="true"></div>
  <div class="boot-gate" id="boot-gate" aria-hidden="true">
    <div class="bg-inner">
      <div class="bg-spinner"></div>
      <div class="bg-brand">Crossroads</div>
      <div class="bg-sub">Loading your workspace…</div>
    </div>
  </div>
  <div id="app">
    <!-- Server rail -->
    <nav class="server-rail" id="server-rail">
      <div class="rail-item home tip" id="rail-home" data-tip="Direct Messages"><i data-ic="message-circle"></i></div>
      <div class="rail-divider"></div>
      <div class="rail-servers" id="rail-servers"></div>
      <div class="rail-item add tip" id="rail-add" data-tip="Add a Server"><i data-ic="plus"></i></div>
      <div class="rail-item explore tip" id="rail-explore" data-tip="Explore Servers"><i data-ic="compass"></i></div>
    </nav>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <header class="sidebar-header" id="sidebar-header">
        <span class="name" id="sidebar-name">Direct Messages</span>
        <i class="chev" data-ic="chevron-down"></i>
      </header>
      <div class="sidebar-banner hidden" id="sidebar-banner"></div>
      <div class="channel-list" id="channel-list"></div>
      <div class="user-panel">
        <div class="me" id="user-panel-me">
          <div class="avatar" id="my-avatar" style="width:32px;height:32px;font-size:13px;"></div>
          <div class="meta">
            <div class="uname" id="my-username">…</div>
            <div class="tag" id="my-tag">#0000</div>
          </div>
        </div>
        <div class="icons">
          <button id="btn-mic" title="Voice Settings"><i data-ic="mic"></i></button>
          <button id="btn-settings" title="User Settings"><i data-ic="settings"></i></button>
        </div>
      </div>
    </aside>

    <!-- Main chat -->
    <main class="chat" id="chat">
      <header class="chat-header" id="chat-header">
        <i class="hash" id="chat-hash" data-ic="hash"></i>
        <span class="title" id="chat-title">Welcome</span>
        <span class="topic" id="chat-topic"></span>
        <div class="spacer"></div>
        <div class="hdr-icons">
          <button id="hdr-notifs" title="Notifications" class="hdr-notif"><i data-ic="bell"></i><span class="notif-badge hidden" id="notif-badge">0</span></button>
          <button id="hdr-members" title="Member List"><i data-ic="users"></i></button>
          <button id="hdr-pins" title="Pinned Messages"><i data-ic="pin"></i></button>
          <button id="hdr-search" title="Search"><i data-ic="search"></i></button>
        </div>
      </header>

      <div class="messages" id="messages">
        <div class="empty-state" id="empty-state">
          <div class="inner">
            <h2>Welcome to Crossroads</h2>
            <p>Select a server on the left or open a direct message to begin. You can also create your own server and invite others with a link.</p>
            <button class="btn" id="empty-create">Create a Server</button>
          </div>
        </div>
      </div>

      <div class="typing-bar" id="typing-bar"></div>

      <div class="composer hidden" id="composer">
        <div class="reply-bar hidden" id="reply-bar"></div>
        <div class="attach-preview hidden" id="attach-preview"></div>
        <div class="composer-box" id="composer-box">
          <button class="cbtn" id="attach-btn" title="Upload a File"><i data-ic="plus-circle"></i></button>
          <textarea id="message-input" rows="1" placeholder="Type a message\u2026"></textarea>
          <button class="cbtn" id="emoji-btn" title="Emoji"><i data-ic="smile"></i></button>
          <button class="send-btn" id="send-btn" title="Send"><i data-ic="send"></i></button>
        </div>
        <div class="composer-hint" id="composer-hint"></div>
        <input type="file" id="file-input" class="hidden" />
      </div>
    </main>

    <!-- Members -->
    <aside class="members" id="members"></aside>
  </div>

  <!-- Modal overlay -->
  <div class="overlay hidden" id="modal-overlay">
    <div class="modal" id="modal"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
