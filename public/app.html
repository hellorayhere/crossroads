<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crossroads</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%235865f2'/><rect x='46' y='20' width='8' height='60' rx='3' fill='white'/></svg>" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div id="app">
    <!-- Server rail -->
    <nav class="server-rail" id="server-rail">
      <div class="rail-item home tip" id="rail-home" data-tip="Direct Messages">
        <i class="fa-solid fa-comment"></i>
      </div>
      <div class="rail-divider"></div>
      <div class="rail-servers" id="rail-servers"></div>
      <div class="rail-item add tip" id="rail-add" data-tip="Add a Server"><i class="fa-solid fa-plus"></i></div>
      <div class="rail-item explore tip" id="rail-explore" data-tip="Explore Servers"><i class="fa-solid fa-compass"></i></div>
    </nav>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <header class="sidebar-header" id="sidebar-header">
        <span class="name" id="sidebar-name">Direct Messages</span>
        <i class="fa-solid fa-chevron-down chev"></i>
      </header>
      <div class="channel-list" id="channel-list"></div>
      <div class="user-panel">
        <div class="me" id="user-panel-me">
          <div class="avatar" id="my-avatar" style="width:32px;height:32px;font-size:13px;"></div>
          <div class="meta">
            <div class="uname" id="my-username">…</div>
            <div class="tag" id="my-tag">#0000</div>
          </div>
        </div>
        <div class="icons">
          <button id="btn-mic" title="Voice Settings"><i class="fa-solid fa-microphone"></i></button>
          <button id="btn-settings" title="User Settings"><i class="fa-solid fa-gear"></i></button>
        </div>
      </div>
    </aside>

    <!-- Main chat -->
    <main class="chat" id="chat">
      <header class="chat-header" id="chat-header">
        <i class="fa-solid fa-hashtag hash" id="chat-hash"></i>
        <span class="title" id="chat-title">Welcome</span>
        <span class="topic" id="chat-topic"></span>
        <div class="spacer"></div>
        <div class="hdr-icons">
          <button id="hdr-members" title="Member List"><i class="fa-solid fa-user-group"></i></button>
          <button id="hdr-pins" title="Pinned Messages"><i class="fa-solid fa-thumbtack"></i></button>
          <button id="hdr-search" title="Search"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>
      </header>

      <div class="messages" id="messages">
        <div class="empty-state" id="empty-state">
          <div class="inner">
            <h2>Welcome to Crossroads</h2>
            <p>Select a server on the left or open a direct message to begin. You can also create your own server and invite others with a link.</p>
            <button class="btn" id="empty-create">Create a Server</button>
          </div>
        </div>
      </div>

      <div class="typing-bar" id="typing-bar"></div>

      <div class="composer hidden" id="composer">
        <div class="attach-preview hidden" id="attach-preview"></div>
        <div class="composer-box" id="composer-box">
          <button class="cbtn" id="attach-btn" title="Upload a File"><i class="fa-solid fa-circle-plus"></i></button>
          <textarea id="message-input" rows="1" placeholder="Message"></textarea>
          <button class="cbtn" id="emoji-btn" title="Emoji"><i class="fa-regular fa-face-smile"></i></button>
          <button class="send-btn" id="send-btn" title="Send"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
        <div class="composer-hint" id="composer-hint"></div>
        <input type="file" id="file-input" class="hidden" />
      </div>
    </main>

    <!-- Members -->
    <aside class="members" id="members"></aside>
  </div>

  <!-- Modal overlay -->
  <div class="overlay hidden" id="modal-overlay">
    <div class="modal" id="modal"></div>
  </div>

  <div class="toast-wrap" id="toast-wrap"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
